name: Temporary graph-database residue cleanup

on:
  push:
    branches:
      - feat/knowledge-hooks
    paths-ignore:
      - '.audit/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply deterministic cleanup
        run: |
          python3 .github/tmp_cleanup_graph_db.py
          python3 .github/tmp_finalize_residue.py
      - name: Commit cleanup result and residual receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup delta'
          else
            git commit -m 'refactor: remove inherited graph-database technology surface'
            git push
          fi
