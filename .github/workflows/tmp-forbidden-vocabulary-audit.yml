name: Temporary forbidden vocabulary audit

on:
  push:
    branches:
      - feat/knowledge-hooks
    paths-ignore:
      - '.audit/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Materialize exact forbidden-vocabulary file inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit
          {
            echo '# Temporary forbidden vocabulary file inventory'
            echo
            echo '## Files whose contents match'
            git grep -iIl -E 'neo4j|ash[_-]?neo4j|AshNeo4j|bolt://|neo4j://|cypher' -- . \
              ':(exclude).github/workflows/tmp-forbidden-vocabulary-audit.yml' \
              ':(exclude).audit/forbidden-vocabulary.txt' | sort -u || true
            echo
            echo '## Filenames that match'
            git ls-files | grep -iE 'neo4j|cypher' | sort -u || true
          } > .audit/forbidden-vocabulary.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .audit/forbidden-vocabulary.txt
          if git diff --cached --quiet; then
            echo 'Inventory unchanged'
          else
            git commit -m 'chore: refresh case-insensitive forbidden vocabulary inventory'
            git push
          fi
