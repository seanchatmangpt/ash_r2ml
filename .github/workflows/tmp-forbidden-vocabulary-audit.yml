name: Temporary forbidden vocabulary audit

on:
  push:
    branches:
      - feat/knowledge-hooks
    paths-ignore:
      - '.audit/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Materialize exact forbidden-vocabulary byte inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit
          pattern='neo4j|ash[_-]?neo4j|ashneo4j|bolt(y)?|apoc|cypher'
          {
            echo '# Temporary forbidden vocabulary byte inventory'
            echo
            echo '## Tracked files whose bytes match'
            git grep -ail -E "$pattern" -- . \
              ':(exclude).github/workflows/tmp-forbidden-vocabulary-audit.yml' \
              ':(exclude).audit/forbidden-vocabulary.txt' | sort -u || true
            echo
            echo '## Tracked filenames that match'
            git ls-files | grep -iE "$pattern" | sort -u || true
          } > .audit/forbidden-vocabulary.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .audit/forbidden-vocabulary.txt
          if git diff --cached --quiet; then
            echo 'Inventory unchanged'
          else
            git commit -m 'chore: refresh byte-level forbidden vocabulary inventory'
            git push
          fi
