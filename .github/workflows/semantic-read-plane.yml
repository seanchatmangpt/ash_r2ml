name: Semantic Read Plane

on: [push, pull_request]

concurrency:
  group: semantic-read-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Database-free verifier for the canonical external semantic read plane.
# This exists independently of the inherited Neo4j/OBDA integration topology:
# schema manufacture, no-write invariants, customization refusal, and sibling
# projection replay do not require a database to prove.
jobs:
  graphql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Bind the receipt to the PR head itself rather than GitHub's synthetic
          # pull-request merge commit. Push events already use github.sha.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact admitted subject
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "exact_head=$actual"

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v2

      - name: Cache exact-toolchain deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-semantic-read-plane-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Verify canonical GraphQL projection and DfCM boundary
        run: mix test test/ggen_api_bundle_test.exs test/semantic_graphql_dfcm_test.exs --trace
