name: Knowledge Hooks Unit

on:
  push:
    branches:
      - main
      - feat/knowledge-hooks
      - feat/frontier-evidence-v1
    paths:
      - "lib/ash_r2rml.ex"
      - "lib/ash_r2rml/semantic_web.ex"
      - "lib/ash_r2rml/knowledge_hooks.ex"
      - "lib/ash_r2rml/knowledge_hook/**"
      - "lib/ash_r2rml/ggen/knowledge_hooks.ex"
      - "lib/ash_r2rml/frontier_evidence.ex"
      - "priv/ontology/knowledge-hooks.ttl"
      - "priv/shapes/knowledge-hooks.shacl.ttl"
      - "test/knowledge_hooks_test.exs"
      - "test/knowledge_hook_ash_test.exs"
      - "test/knowledge_hook_spec_test.exs"
      - "test/knowledge_hook_promotion_test.exs"
      - "test/knowledge_hook_vocabulary_test.exs"
      - "test/knowledge_hook_rdf_test.exs"
      - "test/frontier_evidence_test.exs"
      - "test/adversarial/knowledge_hooks_authority_test.exs"
      - ".github/workflows/knowledge-hooks-unit.yml"
  pull_request:
    paths:
      - "lib/ash_r2rml.ex"
      - "lib/ash_r2rml/semantic_web.ex"
      - "lib/ash_r2rml/knowledge_hooks.ex"
      - "lib/ash_r2rml/knowledge_hook/**"
      - "lib/ash_r2rml/ggen/knowledge_hooks.ex"
      - "lib/ash_r2rml/frontier_evidence.ex"
      - "priv/ontology/knowledge-hooks.ttl"
      - "priv/shapes/knowledge-hooks.shacl.ttl"
      - "test/knowledge_hooks_test.exs"
      - "test/knowledge_hook_ash_test.exs"
      - "test/knowledge_hook_spec_test.exs"
      - "test/knowledge_hook_promotion_test.exs"
      - "test/knowledge_hook_vocabulary_test.exs"
      - "test/knowledge_hook_rdf_test.exs"
      - "test/frontier_evidence_test.exs"
      - "test/adversarial/knowledge_hooks_authority_test.exs"
      - ".github/workflows/knowledge-hooks-unit.yml"

concurrency:
  group: knowledge-hooks-unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v2

      - name: Cache exact-toolchain deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-knowledge-hooks-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Execute knowledge-hook contract and authority falsifiers
        run: >-
          mix test
          test/knowledge_hooks_test.exs
          test/knowledge_hook_ash_test.exs
          test/knowledge_hook_spec_test.exs
          test/knowledge_hook_promotion_test.exs
          test/knowledge_hook_vocabulary_test.exs
          test/knowledge_hook_rdf_test.exs
          test/frontier_evidence_test.exs
          test/adversarial/knowledge_hooks_authority_test.exs
