# Ephemeral Neo4j control databases used only by the inherited integration
# and parity suites. Ports and credentials match config/test.exs exactly.
#
#   neo4j-bolt5 -> bolt://localhost:7687 / http://localhost:7474
#   neo4j-bolt6 -> bolt://localhost:7689 / http://localhost:7475
#   neo4j-apoc  -> bolt://localhost:7691 / http://localhost:7476
#
# No persistent volumes are mounted: CI evidence must be replayable from a
# clean state and tests own their fixtures/rollback semantics.
services:
  neo4j-bolt5:
    image: neo4j:5.26.27
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/password
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j-bolt6:
    # Pin the exact UBI build instead of a floating year/month tag so the
    # Cypher-25/Bolt-6 evidence cannot drift underneath an unchanged commit.
    image: neo4j:2026.05.0-community-ubi10
    ports:
      - "7689:7687"
      - "7475:7474"
    environment:
      NEO4J_AUTH: neo4j/password
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j-apoc:
    image: neo4j:5.26.27
    ports:
      - "7691:7687"
      - "7476:7474"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN apoc.version()' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
